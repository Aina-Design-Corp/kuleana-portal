# The registry pipeline — the architecture's Layer 3 made visible:
#   registry update → validation → manifest build → site build → publication.
#
# validate + build run on every push (the audit trail). The deploy job is the
# infrastructure half of the publication gate: it runs only when the
# repository variable PUBLISH_PAGES is "true" (Settings → Secrets and
# variables → Actions → Variables) AND GitHub Pages is configured with
# Source: GitHub Actions. Until both are set by a person, nothing publishes —
# the same rule the registry applies per record.
name: registry-pipeline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      # Findings are surfaced where a registry editor will actually see them:
      # the job summary on the PR checks page, plus per-file annotations.
      - name: Validate registry (schema + invariants)
        run: |
          set +e
          output=$(node scripts/validate.mjs 2>&1)
          status=$?
          set -e
          echo "$output"
          if [ "$status" -eq 0 ]; then
            {
              echo "### ✅ Registry valid"
              echo
              echo '```'
              echo "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ❌ Registry rejected — nothing builds until these findings are fixed"
              echo
              echo "Each finding names the file, the record, and the rule it breaks:"
              echo
              echo '```'
              echo "$output"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$output" | sed -nE 's|^INVALID  ([A-Za-z0-9_-]+\.json)(.*)$|::error file=registry/\1,title=Registry validation::\1\2|p'
          fi
          exit "$status"

  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Build portal (publication gate applied)
        run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && vars.PUBLISH_PAGES == 'true'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
